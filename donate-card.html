<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donation Cards · Beis Ahavas Yisroel</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#16304f; --navy-900:#0f2138; --gold:#b8873a; --gold-l:#e2c37a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef0f3; font-family: "Assistant", system-ui, sans-serif; color: #223247; }
  .bar { background: var(--navy); color: #fff; padding: .8rem 1.2rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .bar a { color: var(--gold-l); text-decoration: none; font-weight: 700; }
  .bar .t { font-weight: 700; }
  .bar .print { background: linear-gradient(180deg,var(--gold-l),var(--gold)); color: var(--navy-900); border: 0; font-weight: 800; padding: .6rem 1.3rem; border-radius: 999px; cursor: pointer; }
  .intro { max-width: 8.5in; margin: 1rem auto 0; padding: 0 1rem; color: #55627a; font-size: .92rem; text-align: center; line-height: 1.5; }
  .sheet { width: 8.5in; max-width: 100%; margin: 1rem auto 3rem; background: #fff; padding: 0.5in; display: grid; grid-template-columns: 1fr 1fr; gap: 0; box-shadow: 0 12px 45px rgba(0,0,0,.15); }
  .card { width: 3.5in; height: 2.4in; border: 1px dashed #c9cdd4; display: flex; flex-direction: column; overflow: hidden; }

  /* Clippable amount strip along the top edge */
  .amts { display: flex; border-bottom: 1.5px solid var(--navy); }
  .amts span { flex: 1; text-align: center; font-weight: 800; font-size: 11px; color: var(--navy); padding: 4px 0; border-right: 1px solid #d3d7dd; }
  .amts span:last-child { border-right: 0; }

  .body { flex: 1; display: flex; align-items: center; gap: 0.14in; padding: 0.08in 0.16in; }
  .left { flex: 1; min-width: 0; }
  .emblem { width: 26px; height: 26px; vertical-align: middle; }
  .name-he { font-family: "Frank Ruhl Libre", serif; font-weight: 700; color: var(--navy); font-size: 13px; line-height: 1; }
  .name-en { font-family: "Frank Ruhl Libre", serif; font-weight: 700; color: var(--gold); font-size: 9.5px; letter-spacing: .04em; }
  .yk { font-weight: 800; color: var(--navy); font-size: 12px; margin: 5px 0 2px; }
  .tip { font-size: 8px; color: #55627a; line-height: 1.3; }
  .qr { text-align: center; }
  .qr img { width: 1.15in; height: 1.15in; display: block; }
  .qr .cap { font-size: 7.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #55627a; margin-top: 1px; }

  .matana { text-align: center; font-family: "Frank Ruhl Libre", serif; font-weight: 700; color: var(--navy); font-size: 20px; padding: 0 0 5px; line-height: 1; }

  @media print {
    @page { size: letter; margin: 0.5in; }
    body { background: #fff; }
    .no-print { display: none !important; }
    .sheet { box-shadow: none; margin: 0 auto; padding: 0; }
    .card { border: 1px dashed #bbb; }
  }
</style>
</head>
<body>
  <div class="bar no-print">
    <a href="/">&larr; Site home</a>
    <span class="t">Donation Cards</span>
    <button class="print" id="printBtn">🖨 Print sheet (8 cards)</button>
  </div>
  <p class="intro no-print">Print, cut, and hand each honoree a card <strong>and a paper clip</strong>. On Shabbos they clip the amount they’d like to give along the top edge; after Shabbos they scan the QR and donate that amount. Reprint anytime — the QR always points to the shul’s donation page.</p>

  <div class="sheet" id="sheet"></div>

  <script>
    var card =
      '<div class="card">' +
        '<div class="amts"><span>$18</span><span>$36</span><span>$72</span><span>$180</span><span>$360</span><span>$720</span></div>' +
        '<div class="body">' +
          '<div class="left">' +
            '<div><img class="emblem" src="images/logo.svg" alt=""> <span class="name-he" dir="rtl" lang="he">בית אהבת ישראל</span></div>' +
            '<div class="name-en">BEIS AHAVAS YISROEL</div>' +
            '<div class="yk">Yasher Koach!</div>' +
            '<div class="tip">Clip your gift above, then scan to donate after Shabbos.</div>' +
          '</div>' +
          '<div class="qr"><img src="images/donate-qr.svg" alt="Scan to donate"><div class="cap">Scan to donate</div></div>' +
        '</div>' +
        '<div class="matana" dir="rtl" lang="he">מתנה</div>' +
      '</div>';
    document.getElementById('sheet').innerHTML = new Array(8).fill(card).join('');
    document.getElementById('printBtn').addEventListener('click', function () { window.print(); });
  </script>
</body>
</html>
